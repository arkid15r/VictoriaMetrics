name: Copy Repository
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Get all history and tags
          
      - name: Copy to target repository
        env:
          TARGET_REPOSITORY_TOKEN: ${{ secrets.TARGET_REPOSITORY_TOKEN }}
        run: |
          # Add target remote
          git remote add target https://x-access-token:${TARGET_REPOSITORY_TOKEN}@github.com/arkid15r/target-repository.git
          
          # Push selected branches
          git push target master:master --force
          
          # Push all tags
          git push target --tags --force
          
          echo "Repository copied successfully!"